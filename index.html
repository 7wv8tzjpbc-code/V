<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Be My Valentine 💘</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ffd6e8, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }
        .container {
            background: white;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(255, 105, 180, 0.25);
            text-align: center;
            max-width: 420px;
            z-index: 2;
        }
        h1 {
            color: #ff4d88;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .yes {
            background-color: #ff4d88;
            color: white;
        }
        .no {
            background-color: #ffd6e8;
            color: #ff4d88;
            font-weight: 600;
        }
        .heart {
            position: absolute;
            bottom: -20px;
            color: #ff4d88;
            font-size: 20px;
            animation: floatUp linear forwards;
            opacity: 0.8;
        }
        @keyframes floatUp {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-110vh); opacity: 0; }
        }
    </style>
</head>
<body>

<audio id="music" loop>
    <source src="you_belong_with_me_clip.mp3" type="audio/mpeg">
</audio>

<div class="container" id="main">
    <h1>Will you be my Valentine? 💕</h1>
    <div class="buttons">
        <button class="yes" onclick="accept()">Yes</button>
        <button class="no" onclick="forceYes()">No</button>
    </div>
</div>

<script>
    const music = document.getElementById("music");
    music.volume = 0;

    function fadeInMusic() {
        if (music.paused) music.play();
        let volume = 0;
        const fade = setInterval(() => {
            if (volume < 0.4) {
                volume += 0.02;
                music.volume = volume;
            } else {
                clearInterval(fade);
            }
        }, 150);
    }

    function forceYes() {
        fadeInMusic();
        accept();
    }

    function accept() {
        fadeInMusic();
        document.getElementById("main").innerHTML = `
            <h1>🎉 Congratulations! 🎉</h1>
            <p style="font-size:18px; color:#ff4d88; margin-top:20px;">
                You have successfully signed up to be <strong>Krish's Valentine!</strong> 💖
            </p>
        `;
    }

    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 15) + "px";
        heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 300);
</script>

</body>
</html>
